site_name: VLSI
site_url: https://github.com/exteruz/VLSI_documentacion

nav:
  - Inicio: index.md
  - Herramientas: tools/tools.md
  - Manual de Usuario:
      - Introducción: user/1-introduccion.md
      - Simulación: user/2-simulacion.md
      - Prueba en hardware: user/3-funcionamiento.md
  - Desarrollo:
      - Bugs: development/bugs.md
      - Spi BUS: development/spi_bus.md
      - Implementación RAM:
          - development/ram/ram_implementation.md
          - Integracion con el ASIC: development/ram/integration.md
          - Simulación: development/ram/simulation.md
          - Actualización a 32x32: development/ram/cambios_32x32.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["docs"]
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
